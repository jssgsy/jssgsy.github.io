<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>家庭小账本</title>
<style>
:root {
  color-scheme: light dark;
  --bg: light-dark(#f5f6f8,#111318);
  --surface: light-dark(#ffffff,#1b1e25);
  --surface-2: light-dark(#f0f2f5,#252933);
  --text: light-dark(#1e2430,#f2f4f8);
  --muted: light-dark(#727987,#a1a8b5);
  --border: light-dark(#e3e6eb,#343945);
  --green: light-dark(#168653,#5bd69a);
  --green-bg: light-dark(#e9f8f0,#18372b);
  --red: light-dark(#c74c4c,#ff8989);
  --red-bg: light-dark(#fff0f0,#3a2225);
  --blue: light-dark(#3569d4,#8eafff);
  --blue-bg: light-dark(#edf3ff,#222f4c);
  --shadow: 0 8px 26px light-dark(#1e293b0a,#00000020);
}
* { box-sizing: border-box; }
[hidden] { display:none!important; }
body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif; }
button,input,select { font:inherit; }
button { cursor:pointer; }
.app { min-height:100vh; background:var(--bg); padding:24px 16px 40px; }
.shell { width:min(100%,720px); margin:0 auto; }
.top { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:20px; }
.brand { display:flex; align-items:center; gap:11px; }
.logo { width:42px;height:42px;border-radius:14px;background:var(--blue-bg);display:grid;place-items:center;font-size:22px; }
h1 { font-size:24px; line-height:1.15; margin:0; letter-spacing:-.5px; }
.subtitle { font-size:13px;color:var(--muted);margin-top:5px; }
.icon-btn,.secondary-btn { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:12px; padding:10px 13px; }
.section { margin-top:18px; }
.section-head { display:flex; justify-content:space-between; align-items:center; margin:0 2px 10px; gap:10px; }
.section-head h2 { font-size:15px; margin:0; font-weight:700; }
.section-head small { color:var(--muted); font-size:12px; }
.children { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.child-card { border:1px solid var(--border); background:var(--surface); color:var(--text); border-radius:18px; padding:15px; text-align:left; box-shadow:var(--shadow); position:relative; }
.child-card.active { border:2px solid var(--blue); padding:14px; }
.child-card .name { font-size:14px; color:var(--muted); display:flex; justify-content:space-between; gap:8px; }
.child-card .balance { font-size:31px; letter-spacing:-1px; font-weight:750; margin:7px 0 4px; }
.child-card .foot { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); }
.positive { color:var(--green)!important; }
.negative { color:var(--red)!important; }
.card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:17px; box-shadow:var(--shadow); }
.behaviors { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:8px; }
.behavior { border:1px solid var(--border); border-radius:15px; background:var(--surface); color:var(--text); min-width:0; min-height:105px; padding:11px 9px; text-align:left; display:flex; flex-direction:column; justify-content:space-between; gap:12px; transition:transform .12s ease,border-color .12s ease; }
.behavior:active { transform:scale(.98); }
.behavior .b-name { font-size:13px; line-height:1.4; font-weight:650; overflow-wrap:anywhere; }
.behavior .b-bottom { display:flex; align-items:center; justify-content:flex-start; gap:4px; }
.behavior .b-icon { font-size:18px; color:var(--muted); }
.points { font-size:17px; font-weight:750; }
.behavior.plus .points { color:var(--green); }
.behavior.minus .points { color:var(--red); }
.custom-row { display:flex; gap:8px; margin-top:10px; }
.custom-row input { width:100%; min-width:0; }
input,select { border:1px solid var(--border); border-radius:11px; background:var(--surface); color:var(--text); padding:10px 11px; }
.custom-row button { border:0; border-radius:11px; background:var(--blue); color:white; padding:0 15px; font-weight:650; white-space:nowrap; }
.tabs { display:flex; gap:7px; border-bottom:1px solid var(--border); margin-bottom:12px; }
.tab { background:transparent; color:var(--muted); border:0; padding:10px 8px; font-size:13px; border-bottom:2px solid transparent; }
.tab.active { color:var(--blue); border-color:var(--blue); font-weight:700; }
.filter-row { display:flex; gap:8px; align-items:center; margin-bottom:12px; }
.filter-row input { flex:1; min-width:0; }
.log-list { display:flex; flex-direction:column; gap:0; }
.log { display:flex; align-items:center; gap:11px; padding:13px 0; border-bottom:1px solid var(--border); }
.log:last-child { border-bottom:0; }
.log-mark { width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:17px;flex-shrink:0; }
.log-mark.plus { background:var(--green-bg); }
.log-mark.minus { background:var(--red-bg); }
.log-main { flex:1; min-width:0; }
.log-title { font-size:14px; font-weight:650; overflow:hidden;text-overflow:ellipsis;white-space:nowrap; }
.log-meta { color:var(--muted); font-size:12px; margin-top:4px; }
.log-right { text-align:right; flex-shrink:0; }
.log-points { font-weight:750; font-size:16px; }
.log-balance { color:var(--muted); font-size:11px; margin-top:4px; }
.undo { margin-top:4px; border:0; background:transparent; color:var(--muted); font-size:11px; padding:3px; }
.stats { display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px; }
.stat { border-radius:13px;background:var(--surface-2);padding:11px; }
.stat label { display:block;color:var(--muted);font-size:11px;margin-bottom:7px; }
.stat strong { font-size:17px; }
.empty { text-align:center;color:var(--muted);font-size:13px;padding:28px 8px; }
.bottom-note { text-align:center;color:var(--muted);font-size:11px;margin-top:16px;line-height:1.6; }
.modal-backdrop { position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:10; }
.modal-backdrop.show { display:flex; }
.modal { width:min(100%,480px);max-height:calc(100dvh - 24px);display:flex;flex-direction:column;min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:20px;box-shadow:0 18px 60px #0003; }
#modalBody { min-height:0; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; }
.modal h3 { margin:0 0 16px;font-size:18px; }
.field { display:flex;flex-direction:column;gap:7px;margin:12px 0; }
.form-hint { display:block;color:var(--muted);font-size:12px;line-height:1.6;margin:0 0 8px; }
.child-manage-row { display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border); }
.child-manage-name { min-width:0;overflow-wrap:anywhere;font-weight:600; }
.child-manage-row .secondary-btn { padding:8px 11px; }
.field label { font-size:12px;color:var(--muted); }
.modal-actions { display:flex;gap:8px;margin-top:18px; }
.modal-actions button { flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text); }
.modal-actions .primary { background:var(--blue);color:#fff;border-color:var(--blue); }
.toast { position:fixed;left:50%;bottom:25px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:13px;transition:.2s;z-index:20;white-space:nowrap; }
.toast.show { opacity:1;transform:translate(-50%,0); }
.cashout-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.cashout-progress { flex:1; min-width:180px; }
.cashout-bar { height:12px; border-radius:999px; background:var(--surface-2); overflow:hidden; }
.cashout-fill { height:100%; width:0; border-radius:999px; background:var(--blue); transition:width .3s ease; }
.cashout-row.ready .cashout-fill { background:var(--green); }
.cashout-text { display:flex; justify-content:space-between; gap:8px; font-size:12px; color:var(--muted); margin-top:8px; }
.cashout-btn { border:0; border-radius:13px; background:var(--blue); color:#fff; font-weight:700; padding:13px 18px; white-space:nowrap; }
.cashout-btn:disabled { opacity:.4; cursor:not-allowed; }
.cashout-btn.ready { background:var(--green); }
.range-row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.range-row .range-btn { flex:1 1 0; min-width:62px; text-align:center; }
.custom-range { display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:8px; align-items:center; }
.custom-range input { width:100%; min-width:0; padding:10px 9px; }
.range-sep { color:var(--muted); font-size:12px; }
.range-btn { padding:8px 13px; font-size:12px; border-radius:10px; }
.range-btn.active { border-color:var(--blue); color:var(--blue); background:var(--blue-bg); font-weight:700; }
.trend-legend { display:flex; gap:16px; justify-content:center; font-size:11px; color:var(--muted); margin-bottom:8px; }
.legend-dot { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; }
.trend-summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px; margin-bottom:12px; }
.trend-summary .stat strong { font-size:15px; }
.chart-title { font-size:12px; color:var(--muted); font-weight:650; margin:14px 2px 4px; }
.trend-svg { width:100%; height:auto; display:block; }
.trend-svg text { pointer-events:none; }
.trend-detail { text-align:center; font-size:12px; color:var(--muted); min-height:18px; margin-top:8px; }
.behavior-hint { font-size:11px; color:var(--muted); text-align:center; margin-top:9px; line-height:1.5; }
.behavior-tools { display:flex; gap:8px; margin-bottom:10px; }
.behavior-tools input { flex:1; min-width:0; -webkit-appearance:none; appearance:none; }
.behavior-tools button { white-space:nowrap; padding:10px 12px; font-size:12px; }
.sort-btn { padding:8px 11px; font-size:12px; border-radius:10px; white-space:nowrap; }
.behavior { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; touch-action:manipulation; }
.behavior.dragging { z-index:5; position:fixed; pointer-events:none; box-shadow:0 16px 40px #1e293b33; transition:none; will-change:transform; transform:scale(1.03); transform-origin:0 0; margin:0; }
@media(max-width:400px) { .trend-summary { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(min-width:620px) { .app{padding:34px 24px 50px}.behavior{min-height:112px;padding:13px 12px}.behavior .b-name{font-size:14px}.points{font-size:19px}.modal-backdrop{align-items:center}.modal{max-height:calc(100dvh - 48px)} }
@media(max-width:360px) { .child-card .balance{font-size:27px}.card{padding:13px}.behaviors{gap:6px}.behavior{padding:9px 7px;min-height:94px;border-radius:12px}.behavior .b-name{font-size:12px}.behavior .b-icon{font-size:16px}.points{font-size:15px} }
</style>
</head>
<body>
<main class="app">
  <div class="shell">
    <header class="top">
      <div class="brand"><div class="logo">💰</div><div><h1>家庭小账本</h1><div class="subtitle" id="todayLabel">每天一点进步</div></div></div>
      <button class="icon-btn" id="settingsBtn" aria-label="设置">⚙️ 设置</button>
    </header>

    <section class="section">
      <div class="section-head"><h2>小朋友</h2></div>
      <div class="children" id="children"></div>
    </section>

    <section class="section card">
      <div class="section-head"><h2>💰 兑现</h2><small id="cashoutHint">满 100 块可兑现</small></div>
      <div class="cashout-row">
        <div class="cashout-progress">
          <div class="cashout-bar"><div class="cashout-fill" id="cashoutFill"></div></div>
          <div class="cashout-text"><span id="cashoutLeft">还差 100 块</span><span id="cashoutTimes"></span></div>
        </div>
        <button class="cashout-btn" id="cashoutBtn">兑现 100 块</button>
      </div>
    </section>

    <section class="section card">
      <div class="section-head"><h2 id="quickTitle">快速记账 · 小朋友 A</h2><button class="secondary-btn sort-btn" id="behaviorSortBtn">常用优先 ⇄</button></div>
      <div class="behavior-tools">
        <input type="search" id="behaviorSearch" placeholder="搜索记账项" aria-label="搜索记账项" autocomplete="off"/>
        <button class="secondary-btn" id="behaviorMore" hidden>显示全部</button>
      </div>
      <div class="behaviors" id="behaviors"></div>
      <div class="behavior-hint" id="behaviorHint"></div>
      <div class="custom-row">
        <input id="customNote" placeholder="临时项目（可选）" aria-label="临时项目"/>
        <input id="customPoints" type="number" min="-100" max="100" step="1" value="1" style="max-width:88px" aria-label="金额变化"/>
        <button id="customAddBtn">记一笔</button>
      </div>
    </section>

    <section class="section card">
      <div class="section-head"><h2>收支记录</h2><small id="logCount">最近记录</small></div>
      <div class="tabs">
        <button class="tab active" data-tab="recent">最近流水</button>
        <button class="tab" data-tab="day">按日期统计</button>
        <button class="tab" data-tab="trend">每日趋势</button>
      </div>
      <div id="recentPane">
        <div class="filter-row"><input type="date" id="dateFilter" aria-label="筛选日期"/><button class="secondary-btn" id="clearFilter">清除日期</button></div>
        <div class="log-list" id="logs"></div>
      </div>
      <div id="dayPane" hidden>
        <div class="filter-row"><input type="date" id="statsDate" aria-label="统计日期"/></div>
        <div class="stats" id="stats"></div>
        <div class="log-list" id="dayLogs"></div>
      </div>
      <div id="trendPane" hidden>
        <div class="range-row">
          <button class="secondary-btn range-btn" data-range="7">近 7 天</button>
          <button class="secondary-btn range-btn active" data-range="14">近 14 天</button>
          <button class="secondary-btn range-btn" data-range="30">近 30 天</button>
          <button class="secondary-btn range-btn" data-range="custom">自定义</button>
        </div>
        <div class="range-row custom-range" id="customRange" hidden>
          <input type="date" id="trendStart" aria-label="开始日期"/>
          <span class="range-sep">至</span>
          <input type="date" id="trendEnd" aria-label="结束日期"/>
        </div>
        <div class="trend-legend"><span><i class="legend-dot" style="background:var(--green)"></i>加钱</span><span><i class="legend-dot" style="background:var(--red)"></i>扣钱</span></div>
        <div class="trend-summary" id="trendSummary"></div>
        <div class="chart-title">每日金额（块）</div>
        <div id="trendAmount"></div>
        <div class="chart-title">每日笔数（笔）</div>
        <div id="trendCount"></div>
        <div class="trend-detail" id="trendDetail"></div>
      </div>
    </section>
    <div class="bottom-note">数据保存在当前设备的浏览器中 · 可通过 CSV / 图片导出，在 iPhone 与 Mac 之间转移数据<br>CSV 可使用 Mac Numbers 打开和编辑；导入会替换当前设备中的全部记账数据，请先备份</div>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="modalTitle">添加小朋友</h3>
    <div id="modalBody"></div>
    <div class="modal-actions"><button id="cancelModal">取消</button><button class="primary" id="saveModal">保存</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
  const today = () => {
    const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  const nowText = () => new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const CASHOUT = 100;
  const initial = {
    children:[{id:'c1',name:'小朋友 A',initial:20},{id:'c2',name:'小朋友 B',initial:20}],
    behaviors:[
      {id:'b1',name:'主动收拾玩具',delta:5,enabled:true},{id:'b2',name:'按时完成任务',delta:1,enabled:true},
      {id:'b3',name:'帮助家人',delta:1,enabled:true},{id:'b4',name:'认真阅读',delta:5,enabled:true},
      {id:'b5',name:'没有及时收拾',delta:-2,enabled:true},{id:'b6',name:'违反约定',delta:-5,enabled:true}
    ],
    transactions:[
      {id:'t1',childId:'c1',behaviorId:'b2',name:'按时完成任务',delta:5,date:today(),time:'09:10'},
      {id:'t2',childId:'c2',behaviorId:'b5',name:'没有及时收拾',delta:-2,date:today(),time:'09:25'},
      {id:'t3',childId:'c1',behaviorId:'b3',name:'帮助家人',delta:1,date:today(),time:'10:05'}
    ]
  };
  let data;
  try { data = JSON.parse(localStorage.getItem('familyPointsPreview') || 'null') || initial; } catch { data = initial; }
  // Keep transactions linked to immutable child IDs, even when display names change.
  data.children = (data.children || []).map((c,i)=>({...c,id:String(c.id||('c'+(i+1)))}));
  data.transactions = (data.transactions || []).map(t=>({...t,childId:String(t.childId||'')}));
  const childIds = new Set(data.children.map(c=>c.id));
  data.transactions.forEach(t=>{if(!childIds.has(t.childId)){const match=data.children.find(c=>c.name===t.childId);if(match)t.childId=match.id;}});
  let activeChild = data.children[0]?.id;
  let returnToManageChildren = false;
  let modalMode = null;
  let editingId = null;
  let filterDate = '';
  let activeTab = 'recent';
  const $ = id => document.getElementById(id);
  const balance = childId => (data.children.find(c=>c.id===childId)?.initial || 0) + data.transactions.filter(t=>t.childId===childId).reduce((s,t)=>s+t.delta,0);
  const todayDelta = childId => data.transactions.filter(t=>t.childId===childId && t.date===today()).reduce((s,t)=>s+t.delta,0);
  const save = () => { try { localStorage.setItem('familyPointsPreview',JSON.stringify(data)); } catch {} };
  const toast = msg => { const el=$('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700); };
  const childName = id => data.children.find(c=>c.id===id)?.name || '已删除的孩子';
  const renderChildren = () => {
    $('children').innerHTML = data.children.map(c => `<button class="child-card ${c.id===activeChild?'active':''}" data-child="${esc(c.id)}"><div class="name"><span>${esc(c.name)}</span><span>${c.id===activeChild?'●':''}</span></div><div class="balance">${balance(c.id)} <span style="font-size:14px;font-weight:600;letter-spacing:0">块</span></div><div class="foot"><span>今日净变化</span><strong class="${todayDelta(c.id)>=0?'positive':'negative'}">${todayDelta(c.id)>0?'+':''}${todayDelta(c.id)}</strong></div></button>`).join('');
    $('children').querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>{activeChild=b.dataset.child;render();});
    $('quickTitle').textContent='快速记账 · '+childName(activeChild);
  };
  let dragJustEnded = 0;
  let dragActive = false;
  const VISIBLE_BEHAVIORS=6;
  let behaviorSort=(data.behaviorSort==='custom')?'custom':'usage';
  let behaviorSearch='';
  let behaviorExpanded=false;
  const usageStats=()=>{
    const total={},recent={},cutoff=shiftDay(new Date(),-30);
    data.transactions.forEach(t=>{
      const id=t.behaviorId;if(!id||id==='custom'||id==='cashout')return;
      total[id]=(total[id]||0)+1;
      if(t.date>=cutoff)recent[id]=(recent[id]||0)+1;
    });
    return {total,recent};
  };
  const usageCount=id=>data.transactions.filter(t=>t.behaviorId===id).length;
  const behaviorDisplayOrder=(enabled,stats)=>{
    const idx=new Map(enabled.map((b,i)=>[b.id,i]));
    const list=[...enabled];
    if(behaviorSort==='usage'){
      list.sort((a,b)=>{
        const ra=stats.recent[a.id]||0,rb=stats.recent[b.id]||0;if(ra!==rb)return rb-ra;
        const ta=stats.total[a.id]||0,tb=stats.total[b.id]||0;if(ta!==tb)return tb-ta;
        return idx.get(a.id)-idx.get(b.id);
      });
    }
    return list;
  };
  const renderBehaviors = () => {
    const enabled=data.behaviors.filter(b=>b.enabled);
    const stats=usageStats();
    const order=behaviorDisplayOrder(enabled,stats);
    const q=behaviorSearch.trim().toLowerCase();
    const matched=q?order.filter(b=>b.name.toLowerCase().includes(q)):order;
    const visible=(q||behaviorExpanded)?matched:matched.slice(0,VISIBLE_BEHAVIORS);
    const grid=$('behaviors');
    grid.innerHTML=visible.map(b=>`<button class="behavior ${b.delta>=0?'plus':'minus'}" data-behavior="${esc(b.id)}"><span class="b-name">${esc(b.name)}</span><span class="b-bottom"><span class="points">${b.delta>0?'+':''}${b.delta} 块</span></span></button>`).join('')
      || (q?`<div class="empty">没有匹配「${esc(behaviorSearch.trim())}」的记账项</div>`:'<div class="empty">暂无启用的记账项，请到设置中添加</div>');
    grid.querySelectorAll('[data-behavior]').forEach(btn=>{
      btn.onclick=()=>{if(Date.now()-dragJustEnded<400)return;const b=data.behaviors.find(x=>x.id===btn.dataset.behavior);if(!b)return;addTransaction(b.name,b.delta,b.id);};
      bindLongPress(btn,grid);
    });
    const more=$('behaviorMore');

    canvas.width=W*S; canvas.height=H*S;
    const ctx=canvas.getContext('2d');
    ctx.scale(S,S);
    const font=(weight,size)=>`${weight} ${size}px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif`;
    const round=(x,y,w,h,r)=>{ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}};
    const fit=(text,maxW)=>{let s=String(text);if(ctx.measureText(s).width<=maxW)return s;while(s.length&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…';};
    const GREEN='#168653', RED='#c74c4c', TEXT='#1e2430', MUTED='#727987', FAINT='#a1a8b5', BORDER='#e3e6eb';
    ctx.fillStyle='#eef1f6'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#ffffff'; round(18,18,W-36,H-36,28); ctx.fill();
    const L=18+PAD, R=W-18-PAD;
    let y=18+72;
    ctx.textBaseline='middle';
    ctx.textAlign='left';  ctx.fillStyle=TEXT;  ctx.font=font(700,24); ctx.fillText('💰 家庭小账本', L, y);
    ctx.textAlign='right'; ctx.fillStyle=MUTED; ctx.font=font(400,13); ctx.fillText(today(), R, y);
    y+=52;
    ctx.textAlign='left';  ctx.fillStyle=MUTED; ctx.font=font(500,15); ctx.fillText(child.name, L, y);
    y+=50;
    ctx.fillStyle=bal>=0?GREEN:RED; ctx.font=font(800,46); ctx.fillText(bal+' 块', L, y);
    ctx.textAlign='right'; ctx.fillStyle=net>=0?GREEN:RED; ctx.font=font(600,15); ctx.fillText(`今日 ${net>0?'+':''}${net} 块`, R, y);
    ctx.textAlign='left';
    y+=44;
    ctx.strokeStyle=BORDER; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(R,y); ctx.stroke();
    y+=34;
    ctx.fillStyle=MUTED; ctx.font=font(700,14); ctx.fillText('最近记录', L, y);
    y+=30;
    const rowH=54;
    if(!list.length){
      ctx.fillStyle=FAINT; ctx.font=font(400,14); ctx.textAlign='center'; ctx.fillText('还没有记账记录', W/2, y+20); ctx.textAlign='left';
    } else {
      list.forEach((t,i)=>{
        const cy=y+rowH/2;
        ctx.fillStyle=t.delta>=0?'#e9f8f0':'#fff0f0'; round(L,cy-17,34,34,11); ctx.fill();
        ctx.fillStyle=t.delta>=0?GREEN:RED; ctx.font=font(700,16); ctx.textAlign='center'; ctx.fillText(t.delta>=0?'↗':'↘', L+17, cy+1); ctx.textAlign='left';
        ctx.fillStyle=TEXT;  ctx.font=font(600,15); ctx.fillText(fit(t.name, R-L-170), L+48, cy-9);
        ctx.fillStyle=FAINT; ctx.font=font(400,12); ctx.fillText(`${t.date} ${t.time}`, L+48, cy+11);
        ctx.textAlign='right'; ctx.fillStyle=t.delta>=0?GREEN:RED; ctx.font=font(700,17); ctx.fillText(`${t.delta>0?'+':''}${t.delta} 块`, R, cy); ctx.textAlign='left';
        y+=rowH;
        if(i<list.length-1){ctx.strokeStyle='#eef0f4'; ctx.beginPath(); ctx.moveTo(L,y); ctx.lineTo(R,y); ctx.stroke();}
      });
    }
    y+=26;
    ctx.fillStyle=FAINT; ctx.font=font(400,11); ctx.textAlign='center'; ctx.fillText('由「家庭小账本」生成 · 数据保存在浏览器本地', W/2, y+10); ctx.textAlign='left';
    const safeName=child.name.replace(/[\\/:*?"<>|]/g,'_');
    canvas.toBlob(blob=>{
      if(!blob){toast('图片导出失败，请重试');return;}
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url; a.download=`家庭小账本-${safeName}-${today()}.png`; a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast('已导出图片');
    },'image/png');
  };
  const exportData=()=>{const headers=['type','id','name','initial','delta','enabled','childId','behaviorId','date','time'];const rows=[headers,...data.children.map(c=>['child',c.id,c.name,c.initial,'','','','','','']),...data.behaviors.map(b=>['behavior',b.id,b.name,'',b.delta,b.enabled===false?'false':'true','','','','']),...data.transactions.map(t=>['transaction',t.id,t.name,'',t.delta,'',t.childId,t.behaviorId||'',t.date,t.time])];const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='家庭小账本备份-'+today()+'.csv';a.click();URL.revokeObjectURL(url);toast('已导出 CSV');};
  const parseCSV=text=>{const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++;}else if(c==='"')quoted=false;else cell+=c;}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'){row.push(cell.replace(/\r$/,''));if(row.some(v=>v!==''))rows.push(row);row=[];cell='';}else cell+=c;}row.push(cell.replace(/\r$/,''));if(row.some(v=>v!==''))rows.push(row);return rows;};
  const importData=async e=>{const file=e.target.files?.[0];if(!file)return;try{const rows=parseCSV((await file.text()).replace(/^\ufeff/,''));if(rows.length<2||rows[0][0]!=='type')throw new Error('CSV 表头不正确');const ix=Object.fromEntries(rows[0].map((h,i)=>[h,i]));const val=(r,k)=>r[ix[k]]??'';const parsed={children:[],behaviors:[],transactions:[]};for(const r of rows.slice(1)){const type=val(r,'type'),id=val(r,'id'),name=val(r,'name');if(type==='child')parsed.children.push({id,name,initial:Number(val(r,'initial')||0)});else if(type==='behavior')parsed.behaviors.push({id,name,delta:Number(val(r,'delta')),enabled:val(r,'enabled')!=='false'});else if(type==='transaction')parsed.transactions.push({id,name,delta:Number(val(r,'delta')),childId:val(r,'childId'),behaviorId:val(r,'behaviorId')||'custom',date:val(r,'date'),time:val(r,'time')});}if(!parsed.children.length||!parsed.children.every(c=>c.id&&c.name&&Number.isFinite(c.initial))||!parsed.behaviors.every(b=>b.id&&b.name&&Number.isFinite(b.delta))||!parsed.transactions.every(t=>t.id&&t.childId&&t.name&&Number.isFinite(t.delta)&&t.date&&t.time))throw new Error('CSV 数据不完整');if(!confirm(`将导入 ${parsed.children.length} 位孩子、${parsed.behaviors.length} 条记账项、${parsed.transactions.length} 条流水，并替换本设备现有数据。建议先备份。继续吗？`))return;const keepSort=data.behaviorSort;data=parsed;data.behaviorSort=keepSort||'usage';behaviorSort=data.behaviorSort;activeChild=data.children[0]?.id;filterDate='';$('dateFilter').value='';save();closeModal();render();toast('CSV 导入成功');}catch(err){alert('导入失败：请使用本应用导出的 CSV 文件，检查表头和必填字段。');}finally{e.target.value='';}};
  $('settingsBtn').onclick=()=>openModal('settings');
  $('cancelModal').onclick=()=>{returnToManageChildren=false;closeModal();};
  $('modalBackdrop').onclick=e=>{if(e.target===$('modalBackdrop'))closeModal();};
  $('saveModal').onclick=()=>{
    let addedName='';
    if(modalMode==='child'){
      const name=$('fName').value.trim();const initialPoints=Number($('fInitial').value);
      if(!name){toast('请填写小朋友名字');$('fName')?.focus();return;}
      if(data.children.some(c=>c.name.trim().toLowerCase()===name.toLowerCase())){toast('这个名字已存在，请使用不同的名字');$('fName')?.focus();return;}
      if(!Number.isFinite(initialPoints)||initialPoints < -9999 || initialPoints > 9999){toast('请输入 -9999 到 9999 之间的初始金额');return;}
      const c={id:'c'+Date.now()+Math.random().toString(16).slice(2,6),name,initial:Math.trunc(initialPoints)};data.children.push(c);activeChild=c.id;
    } else if(modalMode==='editChild'){
      const c=data.children.find(x=>x.id===editingId);const name=$('fName').value.trim();const points=Number($('fInitial').value);if(!c||!name||!Number.isFinite(points)||points < -9999 || points > 9999){toast('请填写有效的名字和初始金额');return;}if(data.children.some(x=>x.id!==c.id&&x.name.trim().toLowerCase()===name.toLowerCase())){toast('这个名字已存在，请使用不同的名字');return;}c.name=name;c.initial=Math.trunc(points);
    } else if(modalMode==='editBehavior'){
      const b=data.behaviors.find(x=>x.id===editingId);const name=$('fName').value.trim();const delta=Number($('fDelta').value);if(!b||!name||!Number.isFinite(delta)||delta===0){toast('请填写名称和非零金额');return;}b.name=name;b.delta=Math.trunc(delta);
    } else if(modalMode==='behavior'){
      const name=$('fName').value.trim();const delta=Number($('fDelta').value);
      if(!name||!Number.isFinite(delta)||delta===0){toast('请填写名称和非零金额');return;}
      data.behaviors.push({id:'b'+Date.now(),name,delta:Math.trunc(delta),enabled:true});
      addedName=name;
    } else { closeModal();return; }
    save();closeModal();render();if(returnToManageChildren&&(modalMode===null)){returnToManageChildren=false;openModal('manageChildren');}toast(addedName?`已添加「${addedName}」，展开或搜索可看到`:'已保存');
  };
  $('customAddBtn').onclick=()=>{const name=$('customNote').value.trim()||'临时记账';const delta=Number($('customPoints').value);if(!Number.isFinite(delta)||delta===0){toast('请输入非零金额');return;}addTransaction(name,Math.trunc(delta));$('customNote').value='';};
  $('behaviorSortBtn').onclick=()=>{behaviorSort=behaviorSort==='usage'?'custom':'usage';data.behaviorSort=behaviorSort;save();renderBehaviors();toast(behaviorSort==='usage'?'已切换为常用优先排序':'已切换为自定义排序，长按项目可拖动');};
  $('behaviorSearch').addEventListener('input',e=>{behaviorSearch=e.target.value;renderBehaviors();});
  $('behaviorMore').onclick=()=>{behaviorExpanded=!behaviorExpanded;renderBehaviors();};
  $('cashoutBtn').onclick=cashout;
  $('dateFilter').onchange=e=>{filterDate=e.target.value;renderLogs();};
  $('clearFilter').onclick=()=>{$('dateFilter').value='';filterDate='';renderLogs();};
  $('statsDate').value=today();$('statsDate').onchange=renderLogs;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));$('recentPane').hidden=activeTab!=='recent';$('dayPane').hidden=activeTab!=='day';$('trendPane').hidden=activeTab!=='trend';if(activeTab==='trend')renderTrend();});
  const syncTrendRangeUI=()=>{
    document.querySelectorAll('[data-range]').forEach(x=>x.classList.toggle('active',x.dataset.range===(trendMode==='custom'?'custom':String(trendDays))));
    $('customRange').hidden=trendMode!=='custom';
  };
  document.querySelectorAll('[data-range]').forEach(b=>b.onclick=()=>{
    if(b.dataset.range==='custom'){
      trendMode='custom';
      if(!customEnd)customEnd=today();
      if(!customStart)customStart=shiftDay(new Date(customEnd+'T00:00:00'),-13);
      $('trendStart').value=customStart;$('trendEnd').value=customEnd;
      syncTrendRangeUI();renderTrend();
    } else {
      trendMode='preset';trendDays=Number(b.dataset.range);
      syncTrendRangeUI();renderTrend();
    }
  });
  const applyCustomRange=()=>{
    const s=$('trendStart').value,e=$('trendEnd').value;
    if(!s||!e){toast('请选择开始和结束日期');return;}
    let start=s,end=e;
    if(start>end){end=start;toast('开始日期不能晚于结束日期，已调整为同一天');}
    if(Math.round((new Date(end+'T00:00:00')-new Date(start+'T00:00:00'))/86400000)+1>MAX_CUSTOM_DAYS){
      start=shiftDay(new Date(end+'T00:00:00'),-(MAX_CUSTOM_DAYS-1));
      toast(`自定义区间最多 ${MAX_CUSTOM_DAYS} 天，已截取最近 ${MAX_CUSTOM_DAYS} 天`);
    }
    customStart=start;customEnd=end;$('trendStart').value=start;$('trendEnd').value=end;
    renderTrend();
  };
  $('trendStart').onchange=applyCustomRange;
  $('trendEnd').onchange=applyCustomRange;
  let resizeTimer=null;
  window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(activeTab==='trend')renderTrend();},200);});
  data.behaviorSort=behaviorSort;
  save();render();
})();
</script>
